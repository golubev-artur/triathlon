# Параметры стратегии. НЕ подбирать под out-of-sample результат.
# Любое изменение после первого прогона OOS = подгонка.

universe:
  board: TQBR
  min_avg_turnover_rub: 300_000_000   # средний дневной оборот за 60 дней
  turnover_window: 60
  rebuild_every_days: 21              # пересборка вселенной раз в месяц
  max_lot_price_rub: null             # null = без ограничения (песочница);
                                      # для реального счёта на 15к поставить 3000

regime:
  index: IMOEX
  sma: 200                            # IMOEX > SMA(200) -> лонги разрешены

entry:
  rsi_period: 14
  rsi_max: 35                         # перепроданность
  trend_sma: 200                      # цена бумаги > SMA(200)
  days_before_dividend: 5             # не входим за N дней до отсечки
  max_positions: 3
  rank_by: rsi                        # берём N бумаг с наименьшим RSI

sizing:
  risk_per_trade: 0.02                # 2% капитала на сделку
  atr_period: 14
  atr_stop_mult: 2.0                  # стоп = вход - 2*ATR
  max_weight: 0.3333                  # потолок на бумагу

exit:
  rsi_take: 60
  time_stop_days: 20

costs:
  commission_bps: 30                  # 0.30% — пессимистично (базовый тариф)
  slippage_bps: 10                    # 0.10% проскальзывание/спред

cash:
  # доходность денежного рынка, % годовых по годам (RUSFAR/ключевая, приближённо)
  # используется и как доходность кэша, и как бенчмарк
  default_rate: 0.07
  by_year:
    2015: 0.11
    2016: 0.10
    2017: 0.08
    2018: 0.07
    2019: 0.07
    2020: 0.05
    2021: 0.06
    2022: 0.11
    2023: 0.10
    2024: 0.17
    2025: 0.19
    2026: 0.16

backtest:
  start: "2015-01-01"
  in_sample_end: "2021-12-31"         # параметры подбираются ТОЛЬКО здесь
  end: "2026-09-01"
  initial_capital: 100_000

acceptance:                            # критерии приёмки, зафиксированы ДО теста
  min_trades: 40
  min_sharpe: 0.7
  max_drawdown: 0.20
  min_excess_over_cash: 0.05           # +5 п.п. годовых после издержек
