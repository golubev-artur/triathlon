name: Garmin sync

# Каждый день забирает тренировки из Garmin, по воскресеньям строит план
# на следующую неделю и кладёт его в часы. Результат коммитится в main —
# дашборд пересобирается сам (pages.yml).
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   GARMIN_EMAIL, GARMIN_PASSWORD
# Пароль нужен только для первого входа: токен сохраняется в кэше Actions,
# обновляется сам, и дальше Garmin видит один и тот же вход, а не новый каждый день.

on:
  schedule:
    - cron: "0 4 * * *"      # каждый день 07:00 МСК
  workflow_dispatch:
    inputs:
      days:
        description: "Сколько дней истории забрать (3650 — вся, с гонками)"
        default: "3650"

permissions:
  contents: write

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      GARMINTOKENS: ~/.garminconnect
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install --quiet garminconnect

      - name: Токен Garmin из прошлых запусков
        uses: actions/cache/restore@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: garmin-tokens-

      - name: Забрать тренировки из Garmin
        run: python scripts/garmin.py --pull --days "${{ github.event.inputs.days || '90' }}"

      - name: Сохранить токен для следующих запусков
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-${{ github.run_id }}

      - name: План на следующую неделю (по воскресеньям или вручную)
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/autoplan.py --week next
          else
            echo "не воскресенье — план не пересобираем"
          fi

      - name: Тренировки в часы
        run: |
          if git diff --quiet garmin-workouts.json; then
            echo "план не менялся — в часы ничего не шлём"
          else
            python scripts/garmin.py --push
          fi

      - name: Сохранить результаты
        run: |
          git config user.name "garmin-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -f garmin-activities.json plan-weeks.json garmin-workouts.json
          if git diff --cached --quiet; then
            echo "изменений нет"
          else
            git commit -m "Garmin: синхронизация $(date -u +%d.%m.%Y)"
            git push
          fi
